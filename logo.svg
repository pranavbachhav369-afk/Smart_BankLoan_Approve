<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <!-- Cyan/Blue Gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Green Accent Gradient -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner Glow -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Logo Icon Group -->
  <g transform="translate(5, 5)">
    <!-- AI Circuit Pattern Background -->
    <g stroke="url(#logoGradient)" stroke-width="0.5" fill="none" opacity="0.4">
      <circle cx="25" cy="25" r="22" stroke-dasharray="2,2"/>
      <circle cx="25" cy="25" r="18" stroke-dasharray="1,3"/>
      <path d="M 25 3 L 25 8 M 25 42 L 25 47 M 3 25 L 8 25 M 42 25 L 47 25"/>
      <path d="M 8 8 L 12 12 M 38 38 L 42 42 M 42 8 L 38 12 M 8 42 L 12 38"/>
    </g>
    
    <!-- Shield Base -->
    <path d="M 25 5 L 42 12 L 42 28 C 42 38 35 45 25 48 C 15 45 8 38 8 28 L 8 12 Z" 
          fill="rgba(15, 23, 42, 0.8)" 
          stroke="url(#logoGradient)" 
          stroke-width="2"
          filter="url(#glow)"/>
    
    <!-- Shield Inner Glow -->
    <path d="M 25 8 L 39 14 L 39 28 C 39 36 33 42 25 45 C 17 42 11 36 11 28 L 11 14 Z" 
          fill="rgba(6, 182, 212, 0.1)" 
          stroke="none"/>
    
    <!-- Checkmark -->
    <path d="M 16 26 L 23 33 L 34 18" 
          stroke="url(#greenGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"
          filter="url(#glow)"/>
    
    <!-- Growth Graph Element -->
    <g transform="translate(30, 32)">
      <polyline points="0,10 3,8 6,9 9,5 12,6 15,2" 
                fill="none" 
                stroke="url(#logoGradient)" 
                stroke-width="1.5" 
                stroke-linecap="round"
                stroke-linejoin="round"
                opacity="0.8"/>
      <circle cx="15" cy="2" r="2" fill="url(#greenGradient)" filter="url(#glow)"/>
    </g>
    
    <!-- AI Node Dots -->
    <circle cx="25" cy="5" r="1.5" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="42" cy="12" r="1.5" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="42" cy="28" r="1.5" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="8" cy="28" r="1.5" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="8" cy="12" r="1.5" fill="#06b6d4" filter="url(#glow)"/>
  </g>
  
  <!-- Text: SmartLoanApprove -->
  <g transform="translate(55, 35)">
    <!-- SmartLoan -->
    <text x="0" y="0" 
          font-family="'Inter', 'Outfit', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="18" 
          fill="#ffffff"
          letter-spacing="-0.5">
      SmartLoan
    </text>
    
    <!-- Approve with Gradient -->
    <text x="0" y="18" 
          font-family="'Inter', 'Outfit', -apple-system, sans-serif" 
          font-weight="700" 
          font-size="14" 
          fill="url(#logoGradient)"
          letter-spacing="1">
      APPROVE
    </text>
  </g>
</svg>
