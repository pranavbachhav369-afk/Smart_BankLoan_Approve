{% extends "base.html" %}

{% block page_title %}AI Loan Prediction{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 py-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1 fw-bold text-dark">AI Loan Prediction</h4>
                            <p class="text-muted mb-0 small">Get instant loan approval prediction using AI</p>
                        </div>
                        <div class="text-end d-flex gap-2 align-items-center">
                            <a href="/history" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                                <i class="bi bi-clock-history me-1"></i>Prediction History
                            </a>
                            <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 px-3 py-2">
                                <i class="bi bi-cpu me-1"></i>AI Powered
                            </span>
                        </div>
                    </div>
                </div>
                <div class="card-body p-4">
                    <form id="predictionForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-secondary small">Loan Amount (₹)</label>
                                <input type="number" class="form-control" name="loan_amount" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small">Loan Term (Months)</label>
                                <input type="number" class="form-control" name="loan_amount_term" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small">Applicant Income (₹)</label>
                                <input type="number" class="form-control" name="applicant_income" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small">Coapplicant Income (₹)</label>
                                <input type="number" class="form-control" name="coapplicant_income" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secondary small">Credit History</label>
                                <select class="form-select" name="credit_history" required>
                                    <option value="1">Good (1)</option>
                                    <option value="0">Poor (0)</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secondary small">Property Area</label>
                                <select class="form-select" name="property_area" required>
                                    <option value="2">Urban</option>
                                    <option value="1">Semi-Urban</option>
                                    <option value="0">Rural</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secondary small">Dependents</label>
                                <input type="number" class="form-control" name="dependents" value="0" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secondary small">Education</label>
                                <select class="form-select" name="education" required>
                                    <option value="1">Graduate</option>
                                    <option value="0">Not Graduate</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secondary small">Self Employed</label>
                                <select class="form-select" name="self_employed" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secondary small">Married</label>
                                <select class="form-select" name="married" required>
                                    <option value="1">Yes</option>
                                    <option value="0">No</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary px-4" id="predictBtn">
                                <i class="bi bi-magic me-2"></i>Predict Approval
                            </button>
                        </div>
                    </form>

                    <div id="predictionResult" class="mt-4 d-none">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body p-4">
                                <h5 class="text-dark mb-4">Prediction Result</h5>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="text-secondary small">Prediction</label>
                                            <div id="predictionValue" class="h4 text-dark fw-bold"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="text-secondary small">Approval Probability</label>
                                            <div id="probabilityValue" class="h4 text-dark fw-bold"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="text-secondary small">Risk Score</label>
                                            <div id="riskScoreValue" class="h4 text-dark fw-bold"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="text-secondary small">Risk Level</label>
                                            <div id="riskLevelValue" class="h4 text-dark fw-bold"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('predictionForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const payload = {
        gender: 0,
        married: Number(formData.get('married') || 0),
        dependents: Number(formData.get('dependents') || 0),
        education: Number(formData.get('education') || 0),
        self_employed: Number(formData.get('self_employed') || 0),
        applicant_income: Number(formData.get('applicant_income') || 0),
        coapplicant_income: Number(formData.get('coapplicant_income') || 0),
        loan_amount: Number(formData.get('loan_amount') || 0),
        loan_amount_term: Number(formData.get('loan_amount_term') || 0),
        credit_history: Number(formData.get('credit_history') || 0),
        property_area: Number(formData.get('property_area') || 0)
    };

    try {
        const response = await fetch('/api/predict', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
            document.getElementById('predictionResult').classList.remove('d-none');
            document.getElementById('predictionValue').textContent = result.prediction_result;
            document.getElementById('probabilityValue').textContent = (result.approval_probability * 100).toFixed(1) + '%';
            document.getElementById('riskScoreValue').textContent = result.risk_score.toFixed(1) + '%';
            document.getElementById('riskLevelValue').textContent = result.risk_level;
        } else {
            alert('Prediction Error: ' + (result.message || 'Unknown error'));
        }
    } catch (error) {
        alert('Prediction Error: ' + error.message);
    }
});
</script>
{% endblock %}
